<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">Ansible configuration workflow</title><desc id="desc">Review inventory and variables, run syntax checks and pytest, inspect check mode and diff, then apply only to an approved disposable VM and verify the service.</desc>
<rect width="1100" height="380" rx="22" fill="#0b1220"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Configuration Workflow</text><defs><marker id="aw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="25" y="115" width="132" height="78" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="91" y="147" font-size="13" fill="#f8fafc"><tspan x="91" dy="0">Review inventory\nand variables</tspan></text><rect x="178" y="115" width="132" height="78" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="244" y="147" font-size="13" fill="#f8fafc"><tspan x="244" dy="0">Syntax checks</tspan></text><rect x="331" y="115" width="132" height="78" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="397" y="147" font-size="13" fill="#f8fafc"><tspan x="397" dy="0">pytest regression\nsuite</tspan></text><rect x="484" y="115" width="132" height="78" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="550" y="147" font-size="13" fill="#f8fafc"><tspan x="550" dy="0">Check mode + diff</tspan></text><rect x="637" y="170" width="132" height="78" rx="12" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="703" y="202" font-size="13" fill="#f8fafc"><tspan x="703" dy="0">Approved for\ntest host?</tspan></text><rect x="790" y="115" width="132" height="78" rx="12" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="856" y="147" font-size="13" fill="#f8fafc"><tspan x="856" dy="0">Disposable Linux VM</tspan></text><rect x="943" y="115" width="132" height="78" rx="12" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="1009" y="147" font-size="13" fill="#f8fafc"><tspan x="1009" dy="0">Verify service +\n/healthz</tspan></text>
<path d="M157 154 H170" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aw)"/><path d="M310 154 H323" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aw)"/><path d="M463 154 H476" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aw)"/><path d="M616 209 H629" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aw)"/><path d="M769 154 H782" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aw)"/><path d="M922 154 H935" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aw)"/>
<text x="530" y="285" font-size="14" fill="#fbbf24">No approval: revise configuration and rerun checks</text><path d="M535 248 V265" stroke="#f59e0b" stroke-width="2"/></g></svg>