<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Ansible server automation architecture</title><desc id="desc">Operator and CI feed inventory and variables into the site playbook, which invokes reusable roles to configure Linux packages, an optional operations user, and Nginx. Tests validate the project.</desc>
<rect width="1100" height="560" rx="22" fill="#0b1220"/><text x="48" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f8fafc">Ansible Server Automation — Architecture</text><text x="48" y="82" font-family="Arial,sans-serif" font-size="15" fill="#94a3b8">Inventory-driven configuration · reusable roles · controlled validation</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="16" text-anchor="middle">
<rect x="55" y="140" width="220" height="72" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="165" y="168" fill="#dbeafe">Operator / CI</text><text x="165" y="190" fill="#bfdbfe" font-size="13">review + checks</text>
<rect x="350" y="140" width="230" height="72" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="465" y="168" fill="#dbeafe">Inventory + group_vars</text><text x="465" y="190" fill="#bfdbfe" font-size="13">targets + configuration</text>
<rect x="660" y="140" width="220" height="72" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="770" y="181" fill="#eff6ff">site.yml playbook</text>
<path d="M275 176 H345 M580 176 H655" stroke="#60a5fa" stroke-width="3" marker-end="url(#a)" fill="none"/>
<path d="M770 212 V260 H180 V300 M770 260 H550 V300 M770 260 H920 V300" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect x="70" y="305" width="220" height="88" rx="12" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="180" y="338" fill="#d1fae5">base role</text><text x="180" y="363" fill="#a7f3d0" font-size="13">baseline packages</text>
<rect x="405" y="305" width="290" height="88" rx="12" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="550" y="338" fill="#d1fae5">operations_user role</text><text x="550" y="363" fill="#a7f3d0" font-size="13">optional account, opt-in</text>
<rect x="810" y="305" width="220" height="88" rx="12" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="920" y="338" fill="#d1fae5">nginx_site role</text><text x="920" y="363" fill="#a7f3d0" font-size="13">template + service</text>
<path d="M920 393 V430 H745" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect x="475" y="430" width="270" height="68" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="610" y="458" fill="#ecfdf5">Nginx · /healthz:8080</text><text x="610" y="480" fill="#a7f3d0" font-size="13">service + health endpoint</text>
<rect x="55" y="440" width="280" height="58" rx="12" fill="#3b0764" stroke="#c084fc" stroke-width="2"/><text x="195" y="465" fill="#f3e8ff">pytest + syntax checks</text><text x="195" y="484" fill="#e9d5ff" font-size="12">validate project, not a live host</text>
</g></svg>