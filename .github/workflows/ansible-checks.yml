name: Ansible checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run project regression tests
        run: python -m pytest -q
      - name: Validate playbooks with Ansible
        run: |
          ansible-playbook -i inventories/local/hosts.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventories/local/hosts.yml playbooks/validate.yml --syntax-check
