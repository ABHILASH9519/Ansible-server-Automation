---
- name: Verify supported operating system family
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      Unsupported OS family '{{ ansible_facts.os_family }}'.
      This role currently supports Debian-family and RedHat-family Linux hosts.

- name: Install baseline packages on Debian-family systems
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Install baseline packages on RedHat-family systems
  ansible.builtin.package:
    name: "{{ base_packages }}"
    state: present
  when: ansible_facts.os_family == 'RedHat'
