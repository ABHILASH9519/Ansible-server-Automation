---
- name: Validate Nginx role inputs before changing the host
  ansible.builtin.assert:
    that:
      - nginx_listen_port | int >= 1
      - nginx_listen_port | int <= 65535
      - nginx_site_root is match('^/')
      - nginx_server_name is match('^[A-Za-z0-9*._-]+$')
    fail_msg: >-
      nginx_listen_port must be between 1 and 65535, nginx_site_root must be
      an absolute path, and nginx_server_name may contain only hostname
      characters, dots, underscores, asterisks and hyphens.

- name: Install Nginx package
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure managed site root exists
  ansible.builtin.file:
    path: "{{ nginx_site_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install managed landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_site_root }}/index.html"
    owner: root
    group: root
    mode: '0644'
  notify: Validate and reload Nginx

- name: Install managed Nginx site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/conf.d/ansible-managed-site.conf
    owner: root
    group: root
    mode: '0644'
  notify: Validate and reload Nginx

- name: Remove Debian default site symlink when present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: ansible_facts.os_family == 'Debian'
  notify: Validate and reload Nginx

- name: Ensure Nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
